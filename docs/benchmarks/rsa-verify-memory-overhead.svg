<svg xmlns="http://www.w3.org/2000/svg" width="960" height="698" viewBox="0 0 960 698" role="img" aria-labelledby="title desc">
<title id="title">RSA verification peak resident memory difference relative to baseline</title>
<desc id="desc">Peak resident memory difference from reported medians of 7 fresh processes. Fixtures are compared with a standard 2048-bit RSA control and ranked from highest to lowest.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.subtitle{font-size:14px;fill:#556070}.heading{font-size:13px;font-weight:650;fill:#394457}.label{font-size:14px}.value{font-size:14px;font-weight:650}.measured{font-size:13px;fill:#556070}.tick{font-size:12px;fill:#626d7d}.note{font-size:12px;fill:#626d7d}.grid{stroke:#dce2ea;stroke-width:1}.baseline{stroke:#2563eb;stroke-width:2;stroke-dasharray:5 4}</style>
<text class="title" x="24" y="38">RSA Verification Peak RSS vs. 2048-bit Control</text>
<text class="subtitle" x="24" y="64">Control median: 5.109 MiB (0 MiB difference)</text>
<text class="heading" x="280" y="92">RSS difference (MiB)</text>
<text class="heading" x="728" y="92">Difference</text>
<text class="heading" x="940" y="92" text-anchor="end">Median peak RSS</text>
