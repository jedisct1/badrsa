<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">RSA sign time and peak memory</title>
<desc id="desc">Median wall time and peak resident memory for a standard 2048-bit key and malicious RSA fixtures. Whiskers show the observed range across three samples.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.heading{font-size:16px;font-weight:650}.label{font-size:14px}.tick{font-size:12px;fill:#5b6472}.note{font-size:12px;fill:#5b6472}.grid{stroke:#dce1e8;stroke-width:1}.range{stroke-width:3;stroke-linecap:round}.cap{stroke-width:2}</style>
<text class="title" x="24" y="38">RSA Sign Cost</text>
<circle cx="840" cy="30" r="5" fill="#2563eb"/><text class="tick" x="852" y="34">standard</text>
<circle cx="936" cy="30" r="5" fill="#dc2626"/><text class="tick" x="948" y="34">malicious</text>
<text class="heading" x="250" y="78">Median wall time (log scale)</text>
<text class="heading" x="685" y="78">Median peak RSS (MiB)</text>
<line class="grid" x1="274.5" y1="110" x2="274.5" y2="442"/>
<text class="tick" x="274.5" y="102" text-anchor="middle">10 ms</text>
<line class="grid" x1="355.9" y1="110" x2="355.9" y2="442"/>
<text class="tick" x="355.9" y="102" text-anchor="middle">100 ms</text>
<line class="grid" x1="437.2" y1="110" x2="437.2" y2="442"/>
<text class="tick" x="437.2" y="102" text-anchor="middle">1 s</text>
<line class="grid" x1="518.6" y1="110" x2="518.6" y2="442"/>
<text class="tick" x="518.6" y="102" text-anchor="middle">10 s</text>
<line class="grid" x1="600.0" y1="110" x2="600.0" y2="442"/>
<text class="tick" x="600.0" y="102" text-anchor="middle">100 s</text>
<line class="grid" x1="711.9" y1="110" x2="711.9" y2="442"/>
<text class="tick" x="711.9" y="102" text-anchor="middle">5.4</text>
<line class="grid" x1="765.8" y1="110" x2="765.8" y2="442"/>
<text class="tick" x="765.8" y="102" text-anchor="middle">5.6</text>
<line class="grid" x1="819.6" y1="110" x2="819.6" y2="442"/>
<text class="tick" x="819.6" y="102" text-anchor="middle">5.8</text>
<line class="grid" x1="873.5" y1="110" x2="873.5" y2="442"/>
<text class="tick" x="873.5" y="102" text-anchor="middle">6.0</text>
<line class="grid" x1="927.3" y1="110" x2="927.3" y2="442"/>
<text class="tick" x="927.3" y="102" text-anchor="middle">6.2</text>
<line class="grid" x1="981.2" y1="110" x2="981.2" y2="442"/>
<text class="tick" x="981.2" y="102" text-anchor="middle">6.4</text>
<line class="grid" x1="1035.0" y1="110" x2="1035.0" y2="442"/>
<text class="tick" x="1035.0" y="102" text-anchor="middle">6.6</text>
<text class="label" x="236" y="125" text-anchor="end">Standard 2048-bit</text>
<line class="range" stroke="#2563eb" x1="258.2" y1="120" x2="263.4" y2="120"/>
<line class="cap" stroke="#2563eb" x1="258.2" y1="115" x2="258.2" y2="125"/>
<line class="cap" stroke="#2563eb" x1="263.4" y1="115" x2="263.4" y2="125"/>
<circle cx="262.2" cy="120" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
<line class="range" stroke="#2563eb" x1="722.0" y1="120" x2="722.0" y2="120"/>
<line class="cap" stroke="#2563eb" x1="722.0" y1="115" x2="722.0" y2="125"/>
<line class="cap" stroke="#2563eb" x1="722.0" y1="115" x2="722.0" y2="125"/>
<circle cx="722.0" cy="120" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
<text class="label" x="236" y="179" text-anchor="end">Large modulus</text>
<line class="range" stroke="#dc2626" x1="430.7" y1="174" x2="430.7" y2="174"/>
<line class="cap" stroke="#dc2626" x1="430.7" y1="169" x2="430.7" y2="179"/>
<line class="cap" stroke="#dc2626" x1="430.7" y1="169" x2="430.7" y2="179"/>
<circle cx="430.7" cy="174" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<line class="range" stroke="#dc2626" x1="823.0" y1="174" x2="835.6" y2="174"/>
<line class="cap" stroke="#dc2626" x1="823.0" y1="169" x2="823.0" y2="179"/>
<line class="cap" stroke="#dc2626" x1="835.6" y1="169" x2="835.6" y2="179"/>
<circle cx="831.4" cy="174" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<text class="label" x="236" y="233" text-anchor="end">Oversized CRT exponents</text>
<line class="range" stroke="#dc2626" x1="382.6" y1="228" x2="382.6" y2="228"/>
<line class="cap" stroke="#dc2626" x1="382.6" y1="223" x2="382.6" y2="233"/>
<line class="cap" stroke="#dc2626" x1="382.6" y1="223" x2="382.6" y2="233"/>
<circle cx="382.6" cy="228" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<line class="range" stroke="#dc2626" x1="801.9" y1="228" x2="806.2" y2="228"/>
<line class="cap" stroke="#dc2626" x1="801.9" y1="223" x2="801.9" y2="233"/>
<line class="cap" stroke="#dc2626" x1="806.2" y1="223" x2="806.2" y2="233"/>
<circle cx="806.2" cy="228" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<text class="label" x="236" y="287" text-anchor="end">Inconsistent CRT coefficient</text>
<line class="range" stroke="#dc2626" x1="413.2" y1="282" x2="413.3" y2="282"/>
<line class="cap" stroke="#dc2626" x1="413.2" y1="277" x2="413.2" y2="287"/>
<line class="cap" stroke="#dc2626" x1="413.3" y1="277" x2="413.3" y2="287"/>
<circle cx="413.3" cy="282" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<line class="range" stroke="#dc2626" x1="797.7" y1="282" x2="801.9" y2="282"/>
<line class="cap" stroke="#dc2626" x1="797.7" y1="277" x2="797.7" y2="287"/>
<line class="cap" stroke="#dc2626" x1="801.9" y1="277" x2="801.9" y2="287"/>
<circle cx="797.7" cy="282" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<text class="label" x="236" y="341" text-anchor="end">Large public exponent</text>
<line class="range" stroke="#dc2626" x1="576.2" y1="336" x2="576.9" y2="336"/>
<line class="cap" stroke="#dc2626" x1="576.2" y1="331" x2="576.2" y2="341"/>
<line class="cap" stroke="#dc2626" x1="576.9" y1="331" x2="576.9" y2="341"/>
<circle cx="576.5" cy="336" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<line class="range" stroke="#dc2626" x1="1003.9" y1="336" x2="1008.1" y2="336"/>
<line class="cap" stroke="#dc2626" x1="1003.9" y1="331" x2="1003.9" y2="341"/>
<line class="cap" stroke="#dc2626" x1="1008.1" y1="331" x2="1008.1" y2="341"/>
<circle cx="1003.9" cy="336" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<text class="label" x="236" y="395" text-anchor="end">Combined worst case</text>
<line class="range" stroke="#dc2626" x1="575.8" y1="390" x2="576.9" y2="390"/>
<line class="cap" stroke="#dc2626" x1="575.8" y1="385" x2="575.8" y2="395"/>
<line class="cap" stroke="#dc2626" x1="576.9" y1="385" x2="576.9" y2="395"/>
<circle cx="576.3" cy="390" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<line class="range" stroke="#dc2626" x1="1003.9" y1="390" x2="1003.9" y2="390"/>
<line class="cap" stroke="#dc2626" x1="1003.9" y1="385" x2="1003.9" y2="395"/>
<line class="cap" stroke="#dc2626" x1="1003.9" y1="385" x2="1003.9" y2="395"/>
<circle cx="1003.9" cy="390" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<text class="note" x="250" y="480">Dots are medians; whiskers are observed minima and maxima (3 fresh processes per case).</text>
</svg>
