<line class="cap" stroke="#2563eb" x1="794.4" y1="115" x2="794.4" y2="125"/>
<line class="cap" stroke="#2563eb" x1="812.6" y1="115" x2="812.6" y2="125"/>
<circle cx="812.6" cy="120" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
