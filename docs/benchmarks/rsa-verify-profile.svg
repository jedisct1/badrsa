<line class="cap" stroke="#dc2626" x1="885.5" y1="223" x2="885.5" y2="233"/>
<line class="cap" stroke="#dc2626" x1="903.8" y1="223" x2="903.8" y2="233"/>
<circle cx="903.8" cy="228" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<text class="label" x="236" y="287" text-anchor="end">Large modulus</text>
<line class="range" stroke="#dc2626" x1="373.7" y1="282" x2="416.5" y2="282"/>
<line class="cap" stroke="#dc2626" x1="373.7" y1="277" x2="373.7" y2="287"/>
<line class="cap" stroke="#dc2626" x1="416.5" y1="277" x2="416.5" y2="287"/>
<circle cx="380.6" cy="282" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
