<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
<title id="title">RSA verify time and peak memory</title>
<desc id="desc">Median wall time and peak resident memory for a standard 2048-bit key and malicious RSA fixtures. Whiskers show the observed range across three samples.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.heading{font-size:16px;font-weight:650}.label{font-size:14px}.tick{font-size:12px;fill:#5b6472}.note{font-size:12px;fill:#5b6472}.grid{stroke:#dce1e8;stroke-width:1}.range{stroke-width:3;stroke-linecap:round}.cap{stroke-width:2}</style>
<text class="title" x="24" y="38">RSA Verify Cost</text>
<circle cx="840" cy="30" r="5" fill="#2563eb"/><text class="tick" x="852" y="34">standard</text>
<circle cx="936" cy="30" r="5" fill="#dc2626"/><text class="tick" x="948" y="34">malicious</text>
<text class="heading" x="250" y="78">Median wall time</text>
<text class="heading" x="685" y="78">Median peak RSS (MiB)</text>
<line class="grid" x1="250.0" y1="110" x2="250.0" y2="442"/>
<text class="tick" x="250.0" y="102" text-anchor="middle">5 ms</text>
<line class="grid" x1="327.8" y1="110" x2="327.8" y2="442"/>
<text class="tick" x="327.8" y="102" text-anchor="middle">6 ms</text>
<line class="grid" x1="405.6" y1="110" x2="405.6" y2="442"/>
<text class="tick" x="405.6" y="102" text-anchor="middle">7 ms</text>
<line class="grid" x1="483.3" y1="110" x2="483.3" y2="442"/>
<text class="tick" x="483.3" y="102" text-anchor="middle">8 ms</text>
<line class="grid" x1="561.1" y1="110" x2="561.1" y2="442"/>
<text class="tick" x="561.1" y="102" text-anchor="middle">9 ms</text>
<line class="grid" x1="685.0" y1="110" x2="685.0" y2="442"/>
<text class="tick" x="685.0" y="102" text-anchor="middle">5.00</text>
<line class="grid" x1="743.3" y1="110" x2="743.3" y2="442"/>
<text class="tick" x="743.3" y="102" text-anchor="middle">5.05</text>
<line class="grid" x1="801.7" y1="110" x2="801.7" y2="442"/>
<text class="tick" x="801.7" y="102" text-anchor="middle">5.10</text>
<line class="grid" x1="860.0" y1="110" x2="860.0" y2="442"/>
<text class="tick" x="860.0" y="102" text-anchor="middle">5.15</text>
<line class="grid" x1="918.3" y1="110" x2="918.3" y2="442"/>
<text class="tick" x="918.3" y="102" text-anchor="middle">5.20</text>
<line class="grid" x1="976.7" y1="110" x2="976.7" y2="442"/>
<text class="tick" x="976.7" y="102" text-anchor="middle">5.25</text>
<line class="grid" x1="1035.0" y1="110" x2="1035.0" y2="442"/>
<text class="tick" x="1035.0" y="102" text-anchor="middle">5.30</text>
<text class="label" x="236" y="125" text-anchor="end">Standard 2048-bit</text>
<line class="range" stroke="#2563eb" x1="318.2" y1="120" x2="335.7" y2="120"/>
<line class="cap" stroke="#2563eb" x1="318.2" y1="115" x2="318.2" y2="125"/>
<line class="cap" stroke="#2563eb" x1="335.7" y1="115" x2="335.7" y2="125"/>
<circle cx="330.8" cy="120" r="6" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
