<text class="label" x="236" y="341" text-anchor="end">Maximum modulus + exponent</text>
<line class="range" stroke="#dc2626" x1="492.1" y1="336" x2="495.7" y2="336"/>
<line class="cap" stroke="#dc2626" x1="492.1" y1="331" x2="492.1" y2="341"/>
<line class="cap" stroke="#dc2626" x1="495.7" y1="331" x2="495.7" y2="341"/>
<circle cx="495.6" cy="336" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<line class="range" stroke="#dc2626" x1="885.5" y1="336" x2="903.8" y2="336"/>
<line class="cap" stroke="#dc2626" x1="885.5" y1="331" x2="885.5" y2="341"/>
<line class="cap" stroke="#dc2626" x1="903.8" y1="331" x2="903.8" y2="341"/>
<circle cx="903.8" cy="336" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<text class="label" x="236" y="395" text-anchor="end">Maximum unrestricted exponent</text>
<line class="range" stroke="#dc2626" x1="506.6" y1="390" x2="540.1" y2="390"/>
<line class="cap" stroke="#dc2626" x1="506.6" y1="385" x2="506.6" y2="395"/>
<line class="cap" stroke="#dc2626" x1="540.1" y1="385" x2="540.1" y2="395"/>
<circle cx="536.0" cy="390" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<line class="range" stroke="#dc2626" x1="812.6" y1="390" x2="812.6" y2="390"/>
<line class="cap" stroke="#dc2626" x1="812.6" y1="385" x2="812.6" y2="395"/>
<line class="cap" stroke="#dc2626" x1="812.6" y1="385" x2="812.6" y2="395"/>
<circle cx="812.6" cy="390" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<text class="note" x="250" y="480">Dots are medians; whiskers are observed minima and maxima (3 fresh processes per case).</text>
</svg>
