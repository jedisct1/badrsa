<circle cx="679.7" cy="154" r="6" fill="#d45500" stroke="#ffffff" stroke-width="2"/>
<text class="value" x="728" y="159">+1.047 MiB</text>
<text class="measured" x="940" y="159" text-anchor="end">6.484 MiB</text>
<text class="label" x="256" y="209" text-anchor="end">Combined worst case</text>
