<text class="value" x="728" y="609">+0.156 MiB</text>
<text class="measured" x="940" y="609" text-anchor="end">5.594 MiB</text>
<text class="label" x="256" y="659" text-anchor="end">Identity exponents</text>
<line x1="280.0" y1="654" x2="309.8" y2="654" stroke="#d45500" stroke-width="7" stroke-linecap="round"/>
<circle cx="309.8" cy="654" r="6" fill="#d45500" stroke="#ffffff" stroke-width="2"/>
