<text class="tick" x="280.0" y="108" text-anchor="middle">+0.00</text>
<line class="grid" x1="375.5" y1="116" x2="375.5" y2="676"/>
<text class="tick" x="375.5" y="108" text-anchor="middle">+0.25</text>
