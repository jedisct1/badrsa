<line x1="280.0" y1="404" x2="483.1" y2="404" stroke="#d45500" stroke-width="7" stroke-linecap="round"/>
<circle cx="483.1" cy="404" r="6" fill="#d45500" stroke="#ffffff" stroke-width="2"/>
