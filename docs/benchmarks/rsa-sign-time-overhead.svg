<svg xmlns="http://www.w3.org/2000/svg" width="960" height="748" viewBox="0 0 960 748" role="img" aria-labelledby="title desc">
<title id="title">RSA signing wall time ratio relative to baseline</title>
<desc id="desc">Wall time ratio from reported medians of 7 fresh processes. Fixtures are compared with a standard 2048-bit RSA control and ranked from highest to lowest.</desc>
<rect width="100%" height="100%" rx="12" fill="#ffffff"/>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.subtitle{font-size:14px;fill:#556070}.heading{font-size:13px;font-weight:650;fill:#394457}.label{font-size:14px}.value{font-size:14px;font-weight:650}.measured{font-size:13px;fill:#556070}.tick{font-size:12px;fill:#626d7d}.note{font-size:12px;fill:#626d7d}.grid{stroke:#dce2ea;stroke-width:1}.baseline{stroke:#2563eb;stroke-width:2;stroke-dasharray:5 4}</style>
<text class="title" x="24" y="38">RSA Signing Time vs. 2048-bit Control</text>
<text class="subtitle" x="24" y="64">Control median: 5.420 ms (1.00x)</text>
<text class="heading" x="280" y="92">Time ratio</text>
<text class="heading" x="728" y="92">Ratio</text>
<text class="heading" x="940" y="92" text-anchor="end">Median time</text>
<rect x="12" y="182" width="936" height="44" rx="6" fill="#f6f8fb"/>
<rect x="12" y="282" width="936" height="44" rx="6" fill="#f6f8fb"/>
<rect x="12" y="382" width="936" height="44" rx="6" fill="#f6f8fb"/>
<rect x="12" y="482" width="936" height="44" rx="6" fill="#f6f8fb"/>
<rect x="12" y="582" width="936" height="44" rx="6" fill="#f6f8fb"/>
<line class="baseline" x1="280.0" y1="116" x2="280.0" y2="676"/>
<text class="tick" x="280.0" y="108" text-anchor="middle">1x</text>
<line class="grid" x1="385.0" y1="116" x2="385.0" y2="676"/>
<text class="tick" x="385.0" y="108" text-anchor="middle">10x</text>
<line class="grid" x1="490.0" y1="116" x2="490.0" y2="676"/>
<text class="tick" x="490.0" y="108" text-anchor="middle">100x</text>
<line class="grid" x1="595.0" y1="116" x2="595.0" y2="676"/>
<text class="tick" x="595.0" y="108" text-anchor="middle">1,000x</text>
<line class="grid" x1="700.0" y1="116" x2="700.0" y2="676"/>
<text class="tick" x="700.0" y="108" text-anchor="middle">10,000x</text>
<text class="label" x="256" y="159" text-anchor="end">Combined worst case</text>
<line x1="280.0" y1="154" x2="697.8" y2="154" stroke="#d45500" stroke-width="7" stroke-linecap="round"/>
<circle cx="697.8" cy="154" r="6" fill="#d45500" stroke="#ffffff" stroke-width="2"/>
<text class="value" x="728" y="159">9,535x</text>
<text class="measured" x="940" y="159" text-anchor="end">51.681 s</text>
<text class="label" x="256" y="209" text-anchor="end">Large public exponent</text>
<line x1="280.0" y1="204" x2="696.8" y2="204" stroke="#d45500" stroke-width="7" stroke-linecap="round"/>
<circle cx="696.8" cy="204" r="6" fill="#d45500" stroke="#ffffff" stroke-width="2"/>
<text class="value" x="728" y="209">9,332x</text>
<text class="measured" x="940" y="209" text-anchor="end">50.580 s</text>
<text class="label" x="256" y="259" text-anchor="end">Large modulus</text>
<line x1="280.0" y1="254" x2="509.5" y2="254" stroke="#d45500" stroke-width="7" stroke-linecap="round"/>
<circle cx="509.5" cy="254" r="6" fill="#d45500" stroke="#ffffff" stroke-width="2"/>
<text class="value" x="728" y="259">153x</text>
<text class="measured" x="940" y="259" text-anchor="end">830.822 ms</text>
<text class="label" x="256" y="309" text-anchor="end">Repeated prime</text>
<line x1="280.0" y1="304" x2="493.1" y2="304" stroke="#d45500" stroke-width="7" stroke-linecap="round"/>
<circle cx="493.1" cy="304" r="6" fill="#d45500" stroke="#ffffff" stroke-width="2"/>
