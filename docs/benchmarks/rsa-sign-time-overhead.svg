<text class="measured" x="940" y="409" text-anchor="end">466.198 ms</text>
<text class="label" x="256" y="459" text-anchor="end">Oversized CRT exponents</text>
<line x1="280.0" y1="454" x2="447.1" y2="454" stroke="#d45500" stroke-width="7" stroke-linecap="round"/>
<circle cx="447.1" cy="454" r="6" fill="#d45500" stroke="#ffffff" stroke-width="2"/>
<text class="value" x="728" y="459">39.0x</text>
<text class="measured" x="940" y="459" text-anchor="end">211.537 ms</text>
<text class="label" x="256" y="509" text-anchor="end">Unknown private version</text>
<line x1="280.0" y1="504" x2="426.2" y2="504" stroke="#d45500" stroke-width="7" stroke-linecap="round"/>
<circle cx="426.2" cy="504" r="6" fill="#d45500" stroke="#ffffff" stroke-width="2"/>
<text class="value" x="728" y="509">24.7x</text>
<text class="measured" x="940" y="509" text-anchor="end">133.692 ms</text>
<text class="label" x="256" y="559" text-anchor="end">Zero private exponent</text>
<line x1="280.0" y1="554" x2="425.5" y2="554" stroke="#d45500" stroke-width="7" stroke-linecap="round"/>
<circle cx="425.5" cy="554" r="6" fill="#d45500" stroke="#ffffff" stroke-width="2"/>
<text class="value" x="728" y="559">24.3x</text>
<text class="measured" x="940" y="559" text-anchor="end">131.836 ms</text>
<text class="label" x="256" y="609" text-anchor="end">Ignored other-prime record</text>
<line x1="280.0" y1="604" x2="425.3" y2="604" stroke="#d45500" stroke-width="7" stroke-linecap="round"/>
<circle cx="425.3" cy="604" r="6" fill="#d45500" stroke="#ffffff" stroke-width="2"/>
<text class="value" x="728" y="609">24.2x</text>
<text class="measured" x="940" y="609" text-anchor="end">131.301 ms</text>
<text class="label" x="256" y="659" text-anchor="end">Identity exponents</text>
<line x1="280.0" y1="654" x2="331.1" y2="654" stroke="#d45500" stroke-width="7" stroke-linecap="round"/>
<circle cx="331.1" cy="654" r="6" fill="#d45500" stroke="#ffffff" stroke-width="2"/>
<text class="value" x="728" y="659">3.06x</text>
<text class="measured" x="940" y="659" text-anchor="end">16.609 ms</text>
<text class="note" x="280" y="722">Ratio of 7-process medians. Logarithmic scale.</text>
</svg>
